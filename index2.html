<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Thiệp cưới đỏ – trắng sang trọng</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Montserrat:wght@300;400;500;600&family=Allura&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <div class="invite-card">
        <button
          class="music-toggle"
          id="musicToggle"
          aria-label="Bật / tắt nhạc"
        >
          <!-- nếu bạn có file icon đĩa riêng thì dùng img; không có thì có thể bỏ img -->
          <img src="vinyl-record.png" alt="Music disc" class="music-icon" />
        </button>
        <div class="card-flower card-flower-left"></div>
        <div class="card-flower card-flower-right"></div>
        <h2 class="card-title">Save our date</h2>

        <!-- Khối phong bì + bóng -->
        <div class="envelope-wrapper">
          <div class="envelope-shadow">
            <p class="hint" id="hint">Chạm để mở thiệp</p>
          </div>

          <div class="envelope" id="envelope">
            <!-- Lá thư bên trong -->
            <div class="letter">
              <div class="letter-photo"></div>
              <div class="letter-overlay"></div>

              <div class="letter-content">
                <p class="letter-label">Thiệp mời cưới</p>
                <h1 class="letter-names">Mạnh Hùng &amp; Vân Anh</h1>
                <p class="letter-date">30.12.2026</p>
                <div class="letter-guest-block">
                  <p class="letter-invite">Kính mời:</p>
                  <p class="letter-guest">
                    <span class="letter-guest-highlight">Bạn Hùng</span>
                  </p>
                </div>
              </div>
            </div>

            <!-- Phần thân phong bì (màu đỏ) -->
            <div class="front pocket"></div>
            <!-- Cánh hai bên -->
            <div class="front side left"></div>
            <div class="front side right"></div>
            <!-- Nắp trên -->
            <div class="front flap"></div>

            <!-- Con dấu -->
            <div class="wax-seal">
              <span>❀</span>
            </div>

            <!-- Trái tim bay lên -->
            <div class="hearts">
              <div class="heart h1">❤</div>
              <div class="heart h2">❤</div>
              <div class="heart h3">❤</div>
            </div>
          </div>
        </div>

        <div class="invite-body">
          <!-- Ảnh cưới dưới thiệp -->
          <div class="photo-frame">
            <img src="anh_gan_thu.jpg" alt="Ảnh cưới" class="photo-frame-img" />
          </div>

          <!-- ✨ Block khách mời mới -->
          <div class="guest-section">
            <p class="guest-title">TRÂN TRỌNG KÍNH MỜI</p>
            <div class="guest-name-wrapper">
              <p class="guest-name">Lưu Mạnh Hùng</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <audio id="bgMusic" src="ngay_dau_tien.mp3" loop="" preload="auto"></audio>

    <script src="script.js"></script>
  </body>
</html>
